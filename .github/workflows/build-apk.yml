name: بناء تطبيق فلاز

on:
  push:
    branches: [الرئيسي, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: الدفع
        uses: actions/checkout@v4

      - name: البحث عن ملف المشروع
        run: |
          echo "الملفات الموجودة:"
          ls -lah
          echo "ملفات ZIP:"
          find . -type f -name "*.zip" -print

      - name: استخراج مشروع حسنة
        run: |
          ZIP_FILE=$(find . -type f -name "hisba_github_ready_v2.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على hisba_github_ready_v2.zip"
            exit 1
          fi

          echo "سيتم استخراج: $ZIP_FILE"
          mkdir -p hisba_android
          unzip -o "$ZIP_FILE" -d hisba_android

          echo "محتويات المشروع:"
          find hisba_android -maxdepth 2 -type f | head -100

      - name: إعداد جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.0"

      - name: إنشاء مشروع أندرويد
        working-directory: hisba_android
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --platforms=android .
          fi

      - name: الحصول على التبعيات
        working-directory: hisba_android
        run: |
          flutter pub get

      - name: إنشاء ملف APK
        working-directory: hisba_android
        run: |
          flutter build apk --release

      - name: تحميل ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: hisba-release-apk
          path: hisba_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
